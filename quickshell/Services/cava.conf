## Read by services/Cava.qml, never drawn by cava itself: raw numbers on
## stdout, one frame per line, which the shell draws as the spectrum around
## the album art. Kept here rather than in ~/.config/cava so a terminal cava's
## settings and this one can't interfere with each other.

[general]
# Every frame of the screen, because the shape is redrawn from each one and
# a 30fps outline visibly steps.
framerate = 60
autosens = 1

# Stereo, twenty bands a channel. cava lists the left channel from treble
# down to bass and then the right from bass back up, which NotchSpectrum lays
# clockwise from the bottom: the bass ends meet at the top, the treble ends at
# the bottom, and the shape closes without a seam.
bars = 40
lower_cutoff_freq = 40
higher_cutoff_freq = 12000

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 1000
bar_delimiter = 59
frame_delimiter = 10
channels = stereo

[smoothing]
# Turned up, so the outline flows rather than bristles: noise_reduction
# smooths each band over time, monstercat drags neighbours along with a loud
# band so a peak is a swell in the shape rather than a spike.
noise_reduction = 65
monstercat = 1
